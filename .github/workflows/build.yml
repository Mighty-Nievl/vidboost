name: Build Tauri

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            suffix: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: '.exe'
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: ''
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Linux dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      - name: Build static frontend
        run: bun run generate

      - name: Build backend sidecar
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }} --manifest-path server-rs/Cargo.toml
          mkdir -p src-tauri/binaries
          cp "server-rs/target/${{ matrix.target }}/release/vidboost-server${{ matrix.suffix }}" \
             "src-tauri/binaries/vidboost-server-${{ matrix.target }}${{ matrix.suffix }}"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          args: --target ${{ matrix.target }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'VidBoost ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
          uploadArtifacts: true
          includeUpdaterJson: false

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: vidboost-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*
          if-no-files-found: warn
