name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'app/**'
      - 'crates/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: aarch64
            rust_target: aarch64-linux-android
          - abi: armv7
            rust_target: armv7-linux-androideabi
          - abi: i686
            rust_target: i686-linux-android
          - abi: x86_64
            rust_target: x86_64-linux-android

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 34 + NDK 26
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          SDKMANAGER="$(find $ANDROID_HOME/cmdline-tools -type f -name sdkmanager | head -1)"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/ndk/26.1.10909125" > "$GITHUB_WORKSPACE/.ndk-path"

      - name: Setup Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      - name: Create Android sidecar placeholders
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          for triple in aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android; do
            printf '#!/bin/sh\nexit 0\n' > "src-tauri/binaries/vidboost-server-${triple}"
            chmod +x "src-tauri/binaries/vidboost-server-${triple}"
          done

      - name: Init Tauri Android project
        run: bunx tauri android init --config src-tauri/tauri.android.conf.json

      - name: Build frontend
        run: bun run generate

      - name: Build Android APK (debug, tanpa signing)
        run: bunx tauri android build --target ${{ matrix.abi }} --config src-tauri/tauri.android.conf.json --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vidboost-apk-${{ matrix.abi }}
          path: |
            src-tauri/gen/android/app/build/outputs/**/*.apk
          if-no-files-found: warn

      - name: Normalize APK names
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "${{ matrix.abi }}" in
            aarch64) ABI=arm64-v8a ;;
            armv7) ABI=armeabi-v7a ;;
            i686) ABI=x86 ;;
            x86_64) ABI=x86_64 ;;
          esac
          mkdir -p release-apks
          cp src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk "release-apks/vidboost-${VERSION}-${ABI}.apk"

      - name: Release APK pada tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
