[package]
name = "vidboost-app"
version = "0.1.0"
description = "VidBoost desktop — video enhancer lokal"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
vidboost-core = { path = "../crates/vidboost-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["tls"] }
