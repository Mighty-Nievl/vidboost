app = "vidboost-api"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DATA_DIR = "/data"
  FFMPEG_PATH = "ffmpeg"
  FFPROBE_PATH = "ffprobe"
  DRAWTEXT_FONTFILE = "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "vidboost_data"
  destination = "/data"

[vm]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
